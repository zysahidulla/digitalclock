<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Screensaver Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-surface: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.16);
            --glass-blur: 30px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background 1.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: default;
        }

        body.hide-cursor {
            cursor: none;
        }

        /* Ambient Dynamic Skies */
        body.sunrise { background: linear-gradient(145deg, #2d2449 0%, #68486e 40%, #e07f66 80%, #f4c28d 100%); }
        body.day     { background: linear-gradient(145deg, #125ea8 0%, #3a9bf0 50%, #76ddf5 100%); }
        body.sunset  { background: linear-gradient(145deg, #1e0d29 0%, #521844 40%, #ba3f49 80%, #ea8e52 100%); }
        body.night   { background: linear-gradient(145deg, #03070e 0%, #091526 50%, #112338 100%); }

        /* Celestial Orbit System */
        .orbit-system {
            position: absolute;
            top: 105%; 
            left: 50%;
            width: 185vmin; 
            height: 185vmin;
            transform: translate(-50%, -50%); 
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.06);
            z-index: 2;
            pointer-events: none;
            will-change: transform;
            transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        .planet {
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            left: 50%;
            margin-left: -55px; 
            margin-top: -55px;
        }

        .sun {
            top: 0%;
            background: radial-gradient(circle at 35% 35%, #fffbe0 0%, #ffd200 45%, #f7971e 100%);
            box-shadow: 0 0 70px rgba(255, 210, 0, 0.9), 0 0 140px rgba(247, 151, 30, 0.5);
            animation: pulse-sun 7s ease-in-out infinite alternate;
        }

        @keyframes pulse-sun {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.05); filter: brightness(1.1); }
        }

        .moon {
            top: 100%;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #d4d5e0 55%, #9da0b5 100%);
            box-shadow: 0 0 45px rgba(255, 255, 255, 0.6), inset -12px -12px 28px rgba(20, 20, 35, 0.25);
            overflow: hidden;
        }
        
        .moon::before {
            content: '';
            position: absolute;
            top: 24px; left: 34px; width: 22px; height: 22px;
            background: rgba(80, 80, 110, 0.16); 
            border-radius: 50%;
            box-shadow: 36px 14px 0 -4px rgba(80, 80, 110, 0.14), 18px 42px 0 3px rgba(80, 80, 110, 0.12);
        }

        /* Ambient Stars & Clouds */
        .stars {
            position: absolute; 
            width: 100%; 
            height: 100%; 
            top: 0; left: 0;
            background-image: 
                radial-gradient(1.5px 1.5px at 30px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 120px 180px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 280px 110px, rgba(255, 255, 255, 0.9), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 420px 320px, #ffffff, rgba(0,0,0,0));
            background-size: 450px 450px;
            opacity: 0;
            transition: opacity 2s ease;
            z-index: 0;
        }

        .shooting-star {
            position: absolute;
            height: 1.5px;
            background: linear-gradient(-45deg, #fff, rgba(255, 255, 255, 0));
            filter: drop-shadow(0 0 6px #fff);
            transform: rotate(-35deg);
            pointer-events: none;
            opacity: 0;
            z-index: 1;
        }

        .cloud-container {
            position: absolute; 
            width: 100%; 
            height: 100%; 
            top: 0; left: 0;
            z-index: 1; 
            pointer-events: none;
        }
        .cloud {
            position: absolute; 
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 999px;
            animation: drift linear infinite;
        }
        @keyframes drift { 
            from { transform: translateX(-240px); } 
            to { transform: translateX(105vw); } 
        }
        
        .c1 { width: 140px; height: 44px; top: 16%; animation-duration: 40s; }
        .c2 { width: 210px; height: 62px; top: 26%; animation-duration: 54s; animation-delay: -14s; }
        .c3 { width: 160px; height: 50px; top: 12%; animation-duration: 46s; animation-delay: -7s; }

        /* Screensaver Hero Clock */
        .screensaver-clock {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .greeting-badge {
            display: inline-flex;
            align-items: center;
            padding: 8px 22px;
            border-radius: 999px;
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        #greeting { 
            font-size: clamp(16px, 1.8vw, 22px); 
            color: #ffffff; 
            font-weight: 600; 
            letter-spacing: 0.5px;
        }

        #time-wrapper {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: clamp(12px, 2vw, 24px);
        }

        #time { 
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(96px, 18vw, 240px); 
            color: #ffffff; 
            font-weight: 700; 
            letter-spacing: -4px;
            line-height: 0.88;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        #ampm {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(24px, 3.5vw, 48px);
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
        }

        #formatted-date { 
            font-size: clamp(16px, 1.8vw, 24px); 
            color: rgba(255, 255, 255, 0.85); 
            letter-spacing: 1px;
            font-weight: 500;
            margin-top: 24px;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        /* Minimal Floating Dock */
        .dock {
            position: absolute;
            bottom: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(12, 16, 24, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            padding: 6px 14px;
            border-radius: 999px;
            z-index: 101;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.3);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .dock-btn {
            background: transparent;
            border: none;
            outline: none;
            color: rgba(255, 255, 255, 0.8);
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.2s ease;
        }

        .dock-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .dock-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
        }

        .dock-btn.active {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .dock-divider {
            width: 1px;
            height: 16px;
            background: rgba(255, 255, 255, 0.15);
            margin: 0 2px;
        }

        .faded {
            opacity: 0;
            transform: translateY(16px);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="orbit-system">
        <div class="planet sun"></div>
        <div class="planet moon"></div>
    </div>

    <div class="cloud-container">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
    </div>

    <!-- Massive Screensaver Clock -->
    <div class="screensaver-clock">
        <div class="greeting-badge">
            <span id="greeting">Good Morning! 🌅</span>
        </div>
        <div id="time-wrapper">
            <div id="time">00:00:00</div>
            <div id="ampm">AM</div>
        </div>
        <div id="formatted-date">Loading...</div>
    </div>

    <!-- Bottom Controls Dock -->
    <div class="dock" id="controls">
        <button class="dock-btn" id="btn-music" title="Toggle warm ambient music">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <span id="music-label">Ambient Music Off</span>
        </button>

        <div class="dock-divider"></div>

        <button class="dock-btn" id="btn-format" title="Toggle 12h / 24h format">
            <span id="format-label">12H</span>
        </button>

        <button class="dock-btn" id="btn-fullscreen" title="Toggle Fullscreen (F)">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
    </div>

    <script>
        let is24Hour = false;
        let wakeLock = null;

        // Keep Screen Awoken
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.warn('Wake Lock error:', err);
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        // Time, Celestial Orbit, and Original Greetings
        function updateSystem() {
            const now = new Date();
            const dateString = now.toLocaleDateString(undefined, { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            document.getElementById('formatted-date').innerText = dateString;

            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            
            const totalMinutes = (hours * 60) + minutes + (seconds / 60);

            // Orbit Angle
            const rotation = (totalMinutes - 720) * 0.25;
            document.querySelector('.orbit-system').style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
            document.querySelector('.sun').style.transform = `rotate(${-rotation}deg)`;
            document.querySelector('.moon').style.transform = `rotate(${-rotation}deg)`;

            // Background Transitions & Greetings
            const body = document.body;
            const stars = document.querySelector('.stars');
            const clouds = document.querySelector('.cloud-container');
            let greeting = "";
            
            body.className = "";
            if (hours >= 5 && hours < 12) {
                body.classList.add("sunrise");
                greeting = "Good Morning! 🌅";
                stars.style.opacity = 0;
                clouds.style.opacity = 0.85;
            } else if (hours >= 12 && hours < 17) {
                body.classList.add("day");
                greeting = "Good Afternoon! 🌤️";
                stars.style.opacity = 0;
                clouds.style.opacity = 1;
            } else if (hours >= 17 && hours < 21) {
                body.classList.add("sunset");
                greeting = "Good Evening! 🌇";
                stars.style.opacity = 0.35;
                clouds.style.opacity = 0.7;
            } else {
                body.classList.add("night");
                greeting = "Good Night! 🌙";
                stars.style.opacity = 1;
                clouds.style.opacity = 0.2;
            }

            let dispH = hours;
            let ampmStr = '';

            if (!is24Hour) {
                ampmStr = hours >= 12 ? 'PM' : 'AM';
                dispH = hours % 12 || 12;
            }

            const dispM = minutes < 10 ? '0' + minutes : minutes;
            const dispS = seconds < 10 ? '0' + seconds : seconds;

            document.getElementById('time').innerText = `${dispH}:${dispM}:${dispS}`;
            document.getElementById('ampm').innerText = ampmStr;
            document.getElementById('greeting').innerText = greeting;
        }

        // Night Shooting Stars
        function spawnShootingStar() {
            const hours = new Date().getHours();
            if (hours < 18 && hours >= 5) return;

            const star = document.createElement('div');
            star.className = 'shooting-star';
            
            const startX = Math.random() * (window.innerWidth * 0.75);
            const startY = Math.random() * (window.innerHeight * 0.4);
            const length = 70 + Math.random() * 80;

            star.style.left = `${startX}px`;
            star.style.top = `${startY}px`;
            star.style.width = `${length}px`;

            document.body.appendChild(star);

            star.animate([
                { transform: 'translate(0, 0) rotate(-35deg)', opacity: 1 },
                { transform: `translate(${length * 2.5}px, ${length * 1.8}px) rotate(-35deg)`, opacity: 0 }
            ], {
                duration: 900 + Math.random() * 600,
                easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
            }).onfinish = () => star.remove();
        }
        setInterval(spawnShootingStar, 4500);

        // --- Generative Ambient Music Synthesizer ---
        let isMusicPlaying = false;
        let audioCtx = null;
        let masterGain = null;
        let ambientTimer = null;

        // Dreamy lofi chord progression frequencies (Hz)
        const CHORDS = [
            [261.63, 329.63, 392.00, 493.88], // Cmaj7
            [220.00, 261.63, 329.63, 392.00], // Am7
            [174.61, 220.00, 261.63, 329.63], // Fmaj7
            [196.00, 246.94, 293.66, 392.00]  // G6
        ];
        let chordIndex = 0;

        function initAudioEngine() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
            masterGain.connect(audioCtx.destination);

            // Subtle warm tape/vinyl texture
            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let lastOut = 0.0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                output[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = output[i];
                output[i] *= 0.5;
            }

            const tapeNoise = audioCtx.createBufferSource();
            tapeNoise.buffer = noiseBuffer;
            tapeNoise.loop = true;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(650, audioCtx.currentTime);

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.04, audioCtx.currentTime);

            tapeNoise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(masterGain);
            tapeNoise.start(0);
        }

        function playAmbientChord() {
            if (!isMusicPlaying || !audioCtx) return;

            const now = audioCtx.currentTime;
            const chord = CHORDS[chordIndex];
            chordIndex = (chordIndex + 1) % CHORDS.length;

            chord.forEach(freq => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);

                // Slight natural detune for warmth
                osc.detune.setValueAtTime((Math.random() - 0.5) * 8, now);

                // Low-pass warmth filter
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(500, now);
                filter.frequency.exponentialRampToValueAtTime(750, now + 3);
                filter.frequency.exponentialRampToValueAtTime(400, now + 7);

                // Soft ambient envelope (swell and release)
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(0.045, now + 2.8);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 7.2);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(masterGain);

                osc.start(now);
                osc.stop(now + 7.5);
            });
        }

        function toggleAmbientMusic() {
            initAudioEngine();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const btn = document.getElementById('btn-music');
            const label = document.getElementById('music-label');

            if (!isMusicPlaying) {
                isMusicPlaying = true;
                masterGain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 1.5);
                btn.classList.add('active');
                label.innerText = "Ambient Music On";

                playAmbientChord();
                ambientTimer = setInterval(playAmbientChord, 6800);
            } else {
                isMusicPlaying = false;
                masterGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
                btn.classList.remove('active');
                label.innerText = "Ambient Music Off";

                clearInterval(ambientTimer);
            }
        }

        // Auto-Hide Cursor & Dock on Inactivity
        let idleTimeout;
        const controls = document.getElementById('controls');

        function resetIdleTimer() {
            controls.classList.remove('faded');
            document.body.classList.remove('hide-cursor');
            clearTimeout(idleTimeout);
            
            idleTimeout = setTimeout(() => {
                controls.classList.add('faded');
                document.body.classList.add('hide-cursor');
            }, 3500);
        }

        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('click', resetIdleTimer);
        window.addEventListener('keydown', resetIdleTimer);

        // Dock Buttons & Keyboard Controls
        document.getElementById('btn-music').addEventListener('click', toggleAmbientMusic);

        document.getElementById('btn-format').addEventListener('click', () => {
            is24Hour = !is24Hour;
            document.getElementById('format-label').innerText = is24Hour ? '24H' : '12H';
            updateSystem();
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.warn(err));
                requestWakeLock();
            } else {
                document.exitFullscreen();
            }
        }

        document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') toggleFullscreen();
            if (e.key === 'm' || e.key === 'M') toggleAmbientMusic();
        });

        window.onload = function() {
            updateSystem();
            setInterval(updateSystem, 1000);
            requestWakeLock();
            resetIdleTimer();
        };
    </script>
</body>
</html>
